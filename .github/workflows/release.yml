# Publishes prebuilt Linux binaries when a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Tags with a hyphen (v0.2.0-rc.1) are published as pre-releases.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Build release archives
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${GITHUB_REF_NAME}" in *-*) flags="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag $flags
